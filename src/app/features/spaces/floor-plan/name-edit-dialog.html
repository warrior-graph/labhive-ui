<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline">
    <mat-label>{{ data.label }}</mat-label>
    <input matInput [formControl]="name" (keydown.enter)="save()" autofocus />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="dialogRef.close()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" [disabled]="name.invalid" (click)="save()">Salvar</button>
</mat-dialog-actions>
