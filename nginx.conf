## Gateway da UI legada (Angular). A API e o collab rodam com várias réplicas,
## então o proxy usa um upstream balanceado (API) e um upstream com chave fixa
## por documento (collab) — ver labhive-web/nginx.conf para o racional completo.
## ATENÇÃO: o nginx resolve estes nomes no startup. Se `backend` ou `collab`
## ainda não existirem na rede, ele aborta com "host not found in upstream" — é
## por isso que o compose faz os gateways dependerem desses serviços.
upstream labhive_api {
    least_conn;
    server backend:5000;
    keepalive 32;
}

map $uri $collab_document {
    default             "0";
    ~^/collab/doc/(\d+) $1;
}

upstream labhive_collab {
    hash $collab_document consistent;
    server collab:6001;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API has its own namespace so Angular routes such as /labs/1 and
    # /dashboard are never mistaken for Flask endpoints on a hard refresh.
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # The trailing slash strips /api/ before forwarding to Flask.
        proxy_pass         http://labhive_api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /collab {
        return 308 /collab/;
    }

    location /collab/ {
        proxy_pass         http://labhive_collab/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Angular SPA: every non-file route is served by index.html. Angular then
    # restores the requested page and its guards load the authenticated state.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
