server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API has its own namespace so Angular routes such as /labs/1 and
    # /dashboard are never mistaken for Flask endpoints on a hard refresh.
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # The trailing slash strips /api/ before forwarding to Flask.
        proxy_pass         http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /collab {
        return 308 /collab/;
    }

    location /collab/ {
        proxy_pass         http://collab:6001/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Angular SPA: every non-file route is served by index.html. Angular then
    # restores the requested page and its guards load the authenticated state.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
